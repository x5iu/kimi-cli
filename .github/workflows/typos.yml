name: Typo checker
on:
  push:
    branches:
      - allstar

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v4

    - name: Check spelling of the entire repository
      uses: crate-ci/typos@v1.38.1
